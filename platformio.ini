; PlatformIO Project Configuration for Cardputer LoRa Chat
; Using MCP23017 GPIO expander for SX1262 LoRa module (DX-LR-30)

[env:m5stack-cardputer]
platform = espressif32@6.5.0
board = m5stack-stamps3
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

; Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags for M5Stack Cardputer
build_flags =
    -DARDUINO_M5STACK_CARDPUTER
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DLORA_FREQUENCY=868.0
    -DI2C_SDA=2
    -DI2C_SCL=1

; Libraries (no external MCP23017 library - using direct I2C access)
lib_deps =
    m5stack/M5Cardputer@^1.0.2

; Upload settings
upload_speed = 1500000

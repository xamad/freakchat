; ==================== DIY ESP32-S3 WROOM + DX-LR-30 ====================
; Add this section to the main platformio.ini in the Meshtastic firmware folder
;
; Instructions:
; 1. Copy the variant folder to: firmware/variants/diy-esp32s3-dxlr30/
; 2. Add this entry to: firmware/platformio.ini
; 3. Build with: pio run -e diy-esp32s3-dxlr30

[env:diy-esp32s3-dxlr30]
extends = esp32s3_base
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3

; Flash configuration
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.partitions = partitions-4MB.csv

; PSRAM (uncomment if your module has PSRAM)
; board_build.arduino.memory_type = qio_opi

; USB CDC
board_build.f_cpu = 240000000L
build_flags =
    ${esp32s3_base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM=0
    -I variants/diy-esp32s3-dxlr30

; LoRa SX1262 configuration
    -DUSE_SX1262
    -DSX126X_CS=10
    -DSX126X_DIO1=2
    -DSX126X_BUSY=4
    -DSX126X_RESET=3
    -DLORA_SCK=12
    -DLORA_MISO=13
    -DLORA_MOSI=11

; Display ST7789
    -DUSE_ST7789
    -DST7789_CS=36
    -DST7789_RS=38
    -DST7789_SDA=37
    -DST7789_SCK=35
    -DST7789_RESET=39
    -DST7789_BL=40

; I2C
    -DI2C_SDA=8
    -DI2C_SCL=9

; Variant
    -DVARIANT_H=\"variants/diy-esp32s3-dxlr30/variant.h\"

lib_deps =
    ${esp32s3_base.lib_deps}
